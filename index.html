<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="theme-color" content="#06080b">
<script>try{var s=JSON.parse(localStorage.getItem("db.skin"));if(s)document.documentElement.dataset.skin=s}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Anton&family=Archivo+Narrow:wght@500;700&family=Space+Mono:wght@400;700&family=Grenze+Gotisch:wght@500;700&family=Nunito:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a living halftone ink field behind everything; a layered script/condensed masthead; tasks printed as tracklists on distressed xerox posters taped over the field. Single committed look: night wall, bone paper, cyan + acid riso ink. */
:root{
  color-scheme:dark;
  --void:#06080b; --bone:#e6e3d8; --bone-2:#d4d1c4; --ink:#0c0e11; --ash:#7d8691; --pale:#eef2ee;
  --cyan:#8fe6ff; --acid:#c8e86b; --ember:#ffad55; --rose:#f3aac8; --blood:#d13a2c;
  --studies:var(--cyan); --projects:var(--acid); --travel:var(--ember); --personal:var(--rose);
  --p-studies:#14628f; --p-projects:#4f6d0c; --p-travel:#9c4f00; --p-personal:#9b2f62;
  --script:"Pinyon Script","Snell Roundhand",cursive;
  --cond:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Archivo Narrow","Arial Narrow",ui-sans-serif,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{background:var(--void);margin:0}
img{max-width:100%}
/* sign-in poster */
.auth{max-width:420px;width:100%;margin:6px auto 0}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth label{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.auth input{width:100%;border:1px solid rgba(12,14,17,.4);background:rgba(255,255,255,.4);color:var(--ink);padding:10px 12px;font:400 15px var(--mono)}
.auth .btn{background:var(--ink);color:var(--bone);font-size:22px;padding:11px}
.auth .swap{background:none;border:0;color:var(--ink);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;text-decoration:underline;padding:4px 0;align-self:flex-start}
.auth .msg{font:400 12.5px/1.5 var(--mono);margin:0;min-height:1em}
.auth .msg.err{color:var(--blood)}
#app{display:flex;flex-direction:column;gap:22px}
.out{background:none;border:0;color:var(--ash);font:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;padding:0}
body{color:var(--pale);font:16px/1.45 var(--body);min-height:100%;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
::selection{background:var(--acid);color:var(--ink)}

/* ---------- atmosphere layers ---------- */
#field,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#field{z-index:0}
#fx{z-index:40}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.75) 100%)}
.leak{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:screen;opacity:.35;
  background:radial-gradient(45% 55% at -5% 95%,var(--ember),transparent 70%)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:.12;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px)}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:46;opacity:.2;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scratch{position:fixed;top:0;bottom:0;width:1px;background:rgba(238,242,238,.25);pointer-events:none;z-index:46;opacity:0}
.sweep{position:fixed;left:0;right:0;height:22vh;top:-25vh;pointer-events:none;z-index:47;mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent,rgba(143,230,255,.08) 35%,rgba(238,255,210,.55) 50%,rgba(143,230,255,.08) 65%,transparent)}
.sweep.go{animation:sweep .75s cubic-bezier(.5,0,.3,1)}
@keyframes sweep{to{top:110vh}}

/* ---------- masthead ---------- */
.wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;padding-block:26px 90px;display:flex;flex-direction:column;gap:22px}
.mast{position:relative;padding-top:6px;min-height:clamp(190px,42vw,300px)}
.echo{position:absolute;inset:0 auto auto 0;display:flex;flex-direction:column;line-height:.8;pointer-events:none;user-select:none}
.echo span{font:400 clamp(64px,17vw,138px)/.82 var(--cond);text-transform:uppercase;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1px var(--pale);opacity:calc(.55 - var(--i) * .13);transform:translateX(calc(var(--i) * 6px))}
.echo span:first-child{color:var(--pale);-webkit-text-stroke:0;opacity:.92}
.echo.swap span{animation:echoIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes echoIn{from{clip-path:inset(0 100% 0 0);transform:translateX(-20px)}to{clip-path:inset(0)}}
h1.script{position:absolute;right:0;top:clamp(46px,12vw,92px);margin:0;font:400 clamp(70px,19vw,150px)/1 var(--script);color:var(--cyan);
  text-shadow:0 0 18px rgba(143,230,255,.35);filter:url(#warp);transform:rotate(-6deg);cursor:default;white-space:nowrap}
h1.script.glitch{animation:glitch .45s steps(2) 1}
@keyframes glitch{0%{text-shadow:-4px 0 var(--acid),4px 0 var(--rose)}30%{transform:rotate(-6deg) translate(3px,-2px)}60%{text-shadow:5px 1px var(--acid),-3px 0 var(--ember);transform:rotate(-6deg) translate(-4px,1px) skewX(-8deg)}100%{text-shadow:0 0 18px rgba(143,230,255,.35);transform:rotate(-6deg)}}
.byline{position:absolute;left:0;bottom:0;right:0;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font:400 11.5px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--ash)}
.byline .status{margin-left:auto;color:var(--acid)}
.byline .status::before{content:"";display:inline-block;width:7px;height:7px;background:currentColor;margin-right:6px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.stamp{position:absolute;right:4px;top:0;border:2px solid var(--ember);color:var(--ember);padding:5px 9px 4px;font:700 10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;transform:rotate(7deg);text-align:center;mix-blend-mode:screen}
.stamp b{display:block;font:400 34px/1 var(--cond);letter-spacing:.02em}

/* ---------- add strip ---------- */
.add{position:relative;background:var(--ink);border:1px solid #232830;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;transform:rotate(-.5deg)}
.add::before,.add::after{content:"";position:absolute;top:-10px;width:70px;height:20px;background:rgba(230,227,216,.55);transform:rotate(-8deg)}
.add::before{left:-12px}.add::after{right:-12px;transform:rotate(9deg)}
.add-row{display:flex;gap:10px;align-items:center}
.prompt{font:700 15px var(--mono);color:var(--acid)}
#newTitle{flex:1;min-width:0;border:0;background:transparent;font:400 16px var(--mono);padding:6px 0;caret-color:var(--acid)}
#newTitle:focus{outline:none}
#newTitle::placeholder{color:#58606b}
.btn{border:0;padding:9px 16px 7px;background:var(--acid);color:var(--ink);font:400 19px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;transition:transform .15s}
.btn:hover:not(:disabled){transform:rotate(-3deg) scale(1.05)}
.btn:disabled{opacity:.35;cursor:default}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid #2c323b;background:transparent;padding:5px 10px 4px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ash);display:inline-flex;align-items:center;gap:7px;transition:color .15s,border-color .15s,transform .15s}
.chip .dot{width:8px;height:8px;background:var(--c,var(--ash))}
.chip:hover{color:var(--pale);transform:translateY(-1px)}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--c,var(--pale));border-color:var(--c,var(--pale))}
.chip[aria-pressed="true"] .dot{background:var(--ink)}
input[type=date]{border:1px solid #2c323b;background:transparent;padding:4px 8px;font:400 12.5px var(--mono);color:var(--pale)}
.hint{font:400 11px/1.5 var(--mono);color:#5d6570;margin:0;letter-spacing:.04em}
.hint code{color:var(--cyan);font-family:var(--mono)}

/* ---------- tabs: cut-out labels ---------- */
.tabs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tab{border:0;background:var(--bone);color:var(--ink);padding:7px 12px 5px;font:400 20px/1 var(--cond);text-transform:uppercase;letter-spacing:.04em;transform:rotate(var(--r));transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .15s;clip-path:polygon(2% 6%,98% 0,100% 92%,4% 100%)}
.tab:hover{transform:rotate(calc(var(--r) * -1)) scale(1.06)}
.tab[aria-selected="true"]{background:var(--cyan)}
.tab .n{font:700 10px var(--mono);margin-left:5px;vertical-align:5px}
.filters{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- posters ---------- */
.board{display:flex;flex-direction:column;gap:34px}
.pw{position:relative;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));transform:rotate(var(--rot)) perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pw.in{animation:paste .7s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:var(--d,0ms)}
@keyframes paste{from{opacity:0;transform:rotate(calc(var(--rot) * 4)) translateY(30px) scale(.96)}}
.tape{position:absolute;z-index:2;width:92px;height:24px;background:rgba(236,232,214,.6);top:-12px;left:calc(50% - 46px);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.poster{position:relative;background-color:var(--bone);color:var(--ink);padding:22px 18px 16px;clip-path:var(--jag);
  background-image:
    radial-gradient(rgba(12,14,17,.13) .9px,transparent 1.3px),
    radial-gradient(60% 40% at 100% 0%,rgba(12,14,17,.22),transparent 70%),
    radial-gradient(50% 35% at 0% 100%,rgba(12,14,17,.18),transparent 70%),
    linear-gradient(90deg,transparent 0 12%,rgba(12,14,17,.05) 12% 12.4%,transparent 12.4% 71%,rgba(12,14,17,.06) 71% 71.5%,transparent 71.5%);
  background-size:4px 4px,100% 100%,100% 100%,100% 100%}
.poster h2{margin:0 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.poster h2 .big{font:400 clamp(40px,10vw,64px)/.86 var(--cond);text-transform:uppercase;letter-spacing:-.005em}
.poster h2 .scr{font:400 clamp(26px,6vw,36px)/1 var(--script);margin-left:-4px;color:var(--ink)}
.poster h2 small{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.poster.over h2 .big{color:var(--blood)}

/* tracklist rows */
.trk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trk li{border-top:1px dashed rgba(12,14,17,.25)}
.trk li:first-child{border-top:0}
.row{display:grid;grid-template-columns:22px 22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0}
.no{font:700 12px/22px var(--mono);color:rgba(12,14,17,.55)}
.check{width:22px;height:22px;border:2px solid var(--pc);background:transparent;padding:0;display:grid;place-items:center;color:var(--bone);transition:transform .15s}
.check:hover{transform:rotate(-12deg) scale(1.12)}
.check svg{opacity:0}
.done .check{background:var(--pc)}
.done .check svg{opacity:1}
.main{min-width:0;background:transparent;border:0;text-align:left;padding:0;color:var(--ink)}
.t{position:relative;display:inline;font:700 18px/1.2 var(--body);overflow-wrap:anywhere}
.scrib{position:absolute;left:-3px;right:-3px;top:42%;height:12px;width:calc(100% + 6px);overflow:visible;pointer-events:none}
.scrib{opacity:0;clip-path:inset(0 100% 0 0)}
.scrib path{fill:none;stroke:var(--blood);stroke-width:2.6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.done .scrib{opacity:1;clip-path:inset(0)}
.striking .scrib{opacity:1;animation:draw .42s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.done .t{color:rgba(12,14,17,.55)}
.sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:rgba(12,14,17,.6)}
.sub .ar{color:var(--pc);font-weight:700}
.sub .nt::before{content:"✎ "}
.dur{font:700 12px/22px var(--mono);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.dur.late{color:var(--bone);background:var(--blood);padding:0 6px;font-size:13px;transform:rotate(-3deg);animation:throb 1.4s ease-in-out infinite}
.sub .carry{color:var(--blood);font-weight:700}
.has-late small{color:var(--blood)}

/* schedule (calendar) */
.calbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:400 11px var(--mono);color:var(--ash);text-transform:uppercase;letter-spacing:.1em}
.calbar .err{color:var(--ember);text-transform:none;letter-spacing:0;width:100%}
.ev{display:grid;grid-template-columns:78px 5px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px dashed rgba(12,14,17,.25)}
.evs>.ev:first-child,.nowline+.ev{border-top:0}
.ev .tm{font:700 12.5px/1.3 var(--mono);text-transform:uppercase;font-variant-numeric:tabular-nums}
.ev .tm span{display:block;font-weight:400;opacity:.6;font-size:11px}
.ev .bar{align-self:stretch;min-height:24px;background:var(--fc)}
.ev .tt{font:700 17px/1.2 var(--body);overflow-wrap:anywhere}
.ev .lc{display:block;font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;opacity:.65;margin-top:2px;overflow-wrap:anywhere}
.ev.past{opacity:.4}
.ev.now{background:linear-gradient(90deg,rgba(209,58,44,.14),transparent 70%)}
.ev.now .tm::after{content:"now";display:inline-block;margin-top:3px;background:var(--blood);color:var(--bone);padding:1px 6px;font-size:10px;letter-spacing:.08em}
.nowline{position:relative;border-top:2px solid var(--blood);margin:10px 0 6px}
.nowline span{position:absolute;left:0;top:-10px;background:var(--blood);color:var(--bone);font:700 10px var(--mono);padding:2px 6px;text-transform:uppercase;letter-spacing:.08em}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.allday span{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--fc);border-left-width:6px;padding:3px 8px;overflow-wrap:anywhere}
.freeday{font:400 12px var(--mono);opacity:.6;text-transform:uppercase;letter-spacing:.08em;padding:6px 0}
.alsodue{margin-top:10px;padding-top:8px;border-top:3px solid var(--ink);font:400 12.5px/1.5 var(--mono);display:flex;flex-wrap:wrap;gap:4px 14px}
.alsodue b{text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;width:100%}
.alsodue span{overflow-wrap:anywhere}
.alsodue i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px}
.alsodue .lt{color:var(--blood);font-weight:700}
.calmore{display:flex;justify-content:center}
.calset ol{margin:4px 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:8px;font:400 14.5px/1.45 var(--body)}
.calset ol b{font-weight:700}
.calset .warn{font:400 12px/1.5 var(--mono);opacity:.75;margin:0 0 12px}
.calset form,.calmanage form{display:flex;flex-direction:column;gap:8px}
.calset label{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.calset input{width:100%;border:1px solid rgba(12,14,17,.4);background:rgba(255,255,255,.4);color:var(--ink);padding:10px 12px;font:400 14px var(--mono)}
.calset .btn{background:var(--ink);color:var(--bone)}
.calset .msg{font:400 12.5px var(--mono);color:var(--blood);margin:0;min-height:1em}
.calmanage{background:var(--ink);border:1px dashed #2c323b;padding:12px 14px;color:var(--pale)}
.calmanage summary{cursor:pointer;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acid)}
.calmanage ul{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.calmanage li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:400 13px var(--mono)}
.calmanage li i{width:10px;height:10px;background:var(--fc)}
.calmanage li .sp{flex:1}
.calmanage .ghost{color:var(--pale);border-color:#3a414b}
.calmanage .ghost.del{color:#ff8b7d;border-color:#ff8b7d}
.calmanage input{width:100%;border:0;border-bottom:1px solid #2c323b;background:transparent;font:400 14px var(--mono);padding:6px 0;color:var(--pale)}
.calmanage input:focus{outline:none;border-bottom-color:var(--acid)}
.calmanage .msg{font:400 12px var(--mono);color:#ff8b7d;margin:0;min-height:1em}
@keyframes throb{50%{opacity:.45}}
.fresh{animation:print .8s cubic-bezier(.3,.8,.2,1)}
@keyframes print{0%{clip-path:inset(0 0 100% 0);filter:brightness(2.2) contrast(1.6)}60%{clip-path:inset(0);filter:brightness(1.5)}100%{filter:none}}
.shred{animation:shred .42s cubic-bezier(.7,0,.8,.4) forwards}
@keyframes shred{to{clip-path:polygon(0 0,100% 0,100% 0,0 0);transform:translateX(40px) skewX(-25deg);opacity:0}}

.detail{padding:4px 0 14px 54px;display:flex;flex-direction:column;gap:10px}
.detail input,.detail textarea{width:100%;border:1px solid rgba(12,14,17,.35);background:rgba(255,255,255,.35);color:var(--ink);padding:8px 10px;font:400 14px/1.5 var(--mono)}
.detail textarea{min-height:86px;resize:vertical}
.detail .chip{color:rgba(12,14,17,.7);border-color:rgba(12,14,17,.35)}
.detail .chip .dot{background:var(--pc)}
.detail .chip[aria-pressed="true"]{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.detail .chip[aria-pressed="true"] .dot{background:var(--c)}
.detail input[type=date]{width:auto;color:var(--ink);border-color:rgba(12,14,17,.35)}
.detail .sp{flex:1}
.ghost{border:1px solid rgba(12,14,17,.4);background:transparent;padding:6px 11px 5px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.ghost.del{color:var(--blood);border-color:var(--blood)}
.detail .btn{background:var(--ink);color:var(--bone)}

/* empty */
.void{padding:34px 10px 26px;text-align:center}
.void .scr{display:block;font:400 clamp(54px,14vw,92px)/1 var(--script);color:var(--cyan);filter:url(#warp);opacity:.9}
.void p{font:400 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin:6px 0 0}

/* countdown posters */
.cd{padding:20px 18px 18px}
.cd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.cd-top .big{font:400 clamp(40px,10vw,64px)/.86 var(--cond);text-transform:uppercase;overflow-wrap:anywhere}
.cd-top small{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:right;line-height:1.5}
.cd-hero{position:relative;display:flex;align-items:flex-end;gap:6px;margin:6px 0 2px;min-height:clamp(150px,40vw,250px)}
.cd-num{font:400 clamp(150px,44vw,270px)/.78 var(--cond);letter-spacing:-.02em;color:var(--ink);text-shadow:5px 3px 0 rgba(143,230,255,.85),-3px -2px 0 rgba(200,232,107,.7);font-variant-numeric:tabular-nums}
.cd-num.near{color:var(--blood)}
.cd-days{font:400 clamp(44px,12vw,78px)/1 var(--script);transform:rotate(-8deg) translate(-6px,-18%);color:var(--ink)}
.cd-sub{display:flex;flex-wrap:wrap;gap:6px 16px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.cd-clock{font-variant-numeric:tabular-nums;color:var(--blood)}
.tally{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:4px 0 6px}
.tally .dow{font:700 9.5px var(--mono);text-align:center;letter-spacing:.06em;color:rgba(12,14,17,.55);padding-bottom:2px}
.cell{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--ink);font:700 11px/1 var(--mono);display:grid;place-items:center;color:var(--ink);background:transparent}
.cell.pad{border-color:transparent}
.cell.wk{background:rgba(12,14,17,.08)}
.cell.today{background:var(--ink);color:var(--bone)}
.cell.zero{background:var(--blood);border-color:var(--blood);color:var(--bone)}
.cell .dots{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cell .dots i{width:4px;height:4px;border-radius:50%;background:var(--c)}
.cell.today .dots i{outline:1px solid var(--bone)}
.cd-legend{font:400 10.5px var(--mono);color:rgba(12,14,17,.65);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cd-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px}
.cd-act{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.cd-new{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);border:1px dashed #2c323b;padding:12px}
.cd-new input[type=text]{flex:1;min-width:140px;border:0;border-bottom:1px solid #2c323b;background:transparent;font:400 15px var(--mono);padding:6px 0}
.cd-new input:focus{outline:none;border-bottom-color:var(--acid)}
.cd-new .lbl{font:700 11px var(--mono);color:var(--acid);letter-spacing:.1em;text-transform:uppercase;width:100%}

/* notes posters */
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px 22px}
.pad textarea{width:100%;min-height:230px;border:0;background:transparent;resize:vertical;padding:0;color:var(--ink);font:400 14px/1.65 var(--mono)}
.pad textarea::placeholder{color:rgba(12,14,17,.4)}
.pad textarea:focus{outline:none}
.pad .ink{display:block;height:6px;background:var(--pc);margin:-6px 0 10px;width:46px}

.toast{position:fixed;z-index:60;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-1.5deg);background:var(--bone);color:var(--ink);padding:10px 16px 9px;font:700 12.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);clip-path:polygon(0 4%,100% 0,98% 100%,2% 94%)}
.toast:not([hidden]){animation:paste .4s cubic-bezier(.2,.9,.25,1.3)}
.toast button{border:0;background:var(--ink);color:var(--bone);padding:4px 8px;font:inherit}

@media (max-width:520px){.detail{padding-left:0}.row{grid-template-columns:20px 22px minmax(0,1fr) auto;gap:8px}.mast{min-height:235px}.stamp{top:auto;bottom:52px}.byline{gap:4px 10px;font-size:10.5px;letter-spacing:.08em}}
/* ---------- look picker (all skins) ---------- */
.byline>*,.calbar>*{background:color-mix(in srgb,var(--void) 72%,transparent);padding:1px 4px}
.filters .chip,.calmore .chip{background:color-mix(in srgb,var(--void) 80%,transparent)}
.poster h2{flex-wrap:wrap}
.night{display:none}
.looks{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.looks:not([hidden]) .looks-box{animation:paste .45s cubic-bezier(.2,.9,.25,1.2)}
.looks-box{--rot:0deg;width:min(560px,100%);background:var(--bone);color:var(--ink);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.looks-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.looks-top h2{margin:0;font:400 34px/1 var(--cond);text-transform:uppercase}
.looks-top .out{color:var(--ink)}
.looks-note{margin:0;font:400 12.5px/1.5 var(--mono);opacity:.75}
.looks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.look-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border:2px solid transparent;background:transparent;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .15s}
.look-card:hover{transform:translateY(-3px) rotate(-1deg)}
.look-card[aria-pressed="true"]{border-color:var(--ink)}
.lc-art{position:relative;display:block;height:120px;overflow:hidden}
.lc-art b,.lc-art em{position:absolute;font-style:normal}
.lc-wall .lc-art{background:#06080b radial-gradient(#8fe6ff 1.2px,transparent 1.6px) 0 0/7px 7px}
.lc-wall .lc-art b{left:10px;top:8px;font:400 46px/1 "Anton",Impact,sans-serif;color:#eef2ee}
.lc-wall .lc-art em{right:10px;bottom:6px;font:400 40px/1 "Pinyon Script",cursive;color:#8fe6ff;transform:rotate(-6deg)}
.lc-whimsy .lc-art{background:radial-gradient(60% 70% at 70% 30%,rgba(255,158,207,.65),transparent 70%),radial-gradient(50% 60% at 20% 80%,rgba(201,167,255,.6),transparent 70%),#160e1c;border-radius:16px}
.lc-whimsy .lc-art b{left:12px;top:8px;font:700 44px/1 "Grenze Gotisch",serif;color:#f7e8f4}
.lc-whimsy .lc-art em{right:12px;bottom:6px;font:400 40px/1 "Pinyon Script",cursive;color:#ff9ecf;text-shadow:0 0 14px rgba(255,158,207,.7)}
.lc-whimsy .lc-art svg{position:absolute;right:18px;top:14px;width:40px;fill:#2a1830;filter:drop-shadow(0 0 6px rgba(255,158,207,.6))}
.lc-name{font:700 15px var(--body)}
.lc-desc{font:400 11px var(--mono);opacity:.7;text-transform:uppercase;letter-spacing:.06em}

/* ======================================================
   DARK WHIMSY — pastel goth: plum night, pink/lilac haze,
   moon, bats, ink swirls, gothic letters, soft paper
   ====================================================== */
html[data-skin="whimsy"]{
  --void:#160e1c; --bone:#f7eaf3; --bone-2:#ecd8e8; --ink:#2a1830; --ash:#b19bbd; --pale:#f7e8f4;
  --cyan:#ff9ecf; --acid:#c9a7ff; --ember:#ffe7b3; --rose:#ffb3d9; --blood:#c93d7c;
  --studies:#c9a7ff; --projects:#9ff0d1; --travel:#ffc59e; --personal:#ff9ecf;
  --p-studies:#6a3fb8; --p-projects:#1d7a5b; --p-travel:#a65318; --p-personal:#b02a6e;
  --cond:"Grenze Gotisch","UnifrakturCook",Georgia,serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
[data-skin="whimsy"] .night{display:block;position:fixed;inset:0;pointer-events:none;z-index:1}
[data-skin="whimsy"] #stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff3fb;box-shadow:0 0 6px #ffc6e6;opacity:.2;animation:twinkle var(--t) ease-in-out var(--d) infinite}
@keyframes twinkle{50%{opacity:.95}}
[data-skin="whimsy"] .moon{position:absolute;right:max(5vw,18px);top:calc(14px + env(safe-area-inset-top,0px));width:clamp(64px,13vw,120px);filter:drop-shadow(0 0 22px rgba(255,214,236,.7)) drop-shadow(0 0 60px rgba(255,158,207,.35));animation:moon 9s ease-in-out infinite;transform-origin:50% -40%}
@keyframes moon{50%{transform:rotate(-6deg)}}
[data-skin="whimsy"] .swirl{position:absolute;fill:none;stroke:rgba(247,232,244,.13);stroke-width:1.6;stroke-linecap:round}
[data-skin="whimsy"] .sw1{width:260px;left:-70px;bottom:6%;animation:spin 60s linear infinite}
[data-skin="whimsy"] .sw2{width:180px;right:-40px;top:38%;animation:spin 80s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
[data-skin="whimsy"] .batfly{position:absolute;left:-60px;width:44px;opacity:.85}
[data-skin="whimsy"] .batfly svg{width:100%;overflow:visible}
[data-skin="whimsy"] .batfly .wing{fill:#2a1830;stroke:rgba(255,158,207,.45);stroke-width:.5;transform-origin:0 0;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.35)}}
[data-skin="whimsy"] .b1{top:16%;animation:fly 23s linear infinite}
[data-skin="whimsy"] .b2{top:9%;width:30px;animation:fly 31s linear 7s infinite}
[data-skin="whimsy"] .b3{top:30%;width:24px;animation:fly 37s linear 15s infinite}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(28vw,-6vh)}50%{transform:translate(55vw,4vh)}75%{transform:translate(82vw,-8vh)}100%{transform:translate(calc(100vw + 120px),2vh)}}
[data-skin="whimsy"] #field{filter:blur(14px) saturate(1.25);opacity:.9}
[data-skin="whimsy"] .vignette{background:radial-gradient(120% 90% at 50% 40%,transparent 35%,rgba(10,4,14,.8) 100%)}
[data-skin="whimsy"] .leak{opacity:.4;background:radial-gradient(40% 40% at 92% 6%,#ffd6ec,transparent 70%),radial-gradient(50% 50% at 0% 100%,#7d4fb8,transparent 70%)}
[data-skin="whimsy"] .scan,[data-skin="whimsy"] .scratch{display:none}
[data-skin="whimsy"] .grain{opacity:.1;mix-blend-mode:soft-light}
[data-skin="whimsy"] .sweep{background:linear-gradient(180deg,transparent,rgba(255,158,207,.1) 35%,rgba(255,240,250,.45) 50%,rgba(201,167,255,.1) 65%,transparent)}
/* masthead */
[data-skin="whimsy"] .echo span{font-weight:700;text-transform:none;-webkit-text-stroke:1px var(--acid);letter-spacing:0}
[data-skin="whimsy"] .echo span:first-child{color:var(--pale);text-shadow:0 0 24px rgba(255,158,207,.35)}
[data-skin="whimsy"] h1.script{filter:none;color:var(--cyan);text-shadow:0 0 12px rgba(255,158,207,.8),0 0 40px rgba(201,167,255,.5);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-4deg) translateY(-6px)}}
[data-skin="whimsy"] h1.script.glitch{animation:shimmer .6s ease-out 1}
@keyframes shimmer{40%{text-shadow:0 0 24px #fff,0 0 60px var(--cyan)}}
[data-skin="whimsy"] .stamp{border-radius:50%;width:92px;height:92px;display:grid;place-content:center;border:1.5px dashed var(--ember);color:var(--ember);mix-blend-mode:normal;top:auto;bottom:34px;right:clamp(90px,18vw,170px);transform:rotate(-8deg)}
[data-skin="whimsy"] .stamp b{font-weight:700;font-size:32px}
[data-skin="whimsy"] .byline{color:var(--ash)}
[data-skin="whimsy"] .byline .status{color:var(--acid)}
/* add strip */
[data-skin="whimsy"] .add{background:rgba(42,24,48,.72);backdrop-filter:blur(10px);border:1px solid rgba(201,167,255,.35);border-radius:22px;transform:none;box-shadow:0 0 40px -10px rgba(255,158,207,.35)}
[data-skin="whimsy"] .add::before,[data-skin="whimsy"] .add::after{background:repeating-linear-gradient(90deg,rgba(255,158,207,.75) 0 6px,rgba(255,198,226,.75) 6px 12px);border-radius:2px}
[data-skin="whimsy"] .prompt{color:var(--cyan)}
[data-skin="whimsy"] .prompt::after{content:"";display:none}
[data-skin="whimsy"] #newTitle{caret-color:var(--cyan)}
[data-skin="whimsy"] #newTitle::placeholder{color:#8a7596}
[data-skin="whimsy"] .chip{border-radius:999px;border-color:rgba(201,167,255,.3);color:var(--ash)}
[data-skin="whimsy"] .chip .dot{border-radius:50%}
[data-skin="whimsy"] .chip[aria-pressed="true"]{color:var(--ink);border-color:var(--c,var(--pale))}
[data-skin="whimsy"] .detail .chip{color:rgba(42,24,48,.75);border-color:rgba(42,24,48,.3)}
[data-skin="whimsy"] .detail .chip[aria-pressed="true"]{color:var(--bone);border-color:var(--ink)}
[data-skin="whimsy"] .btn{border-radius:999px;background:linear-gradient(135deg,var(--cyan),var(--acid));color:var(--ink);text-transform:none;font-weight:700;box-shadow:0 4px 18px -6px rgba(255,158,207,.8)}
[data-skin="whimsy"] input[type=date]{border-radius:999px;border-color:rgba(201,167,255,.3)}
[data-skin="whimsy"] .hint{color:#8f7a9c}
[data-skin="whimsy"] .hint code{color:var(--cyan)}
/* tabs as ribbons */
[data-skin="whimsy"] .tab{clip-path:none;border-radius:999px;background:rgba(247,232,244,.12);color:var(--pale);border:1px solid rgba(201,167,255,.35);text-transform:none;font-weight:700;font-size:21px;padding:6px 14px 5px;backdrop-filter:blur(6px)}
[data-skin="whimsy"] .tab[aria-selected="true"]{background:var(--pale);color:var(--ink);box-shadow:0 0 22px -4px rgba(255,158,207,.8)}
/* posters become soft storybook cards */
[data-skin="whimsy"] .pw{filter:drop-shadow(0 16px 26px rgba(10,2,16,.55)) drop-shadow(0 0 30px rgba(255,158,207,.12));transform:rotate(calc(var(--rot) * .45)) perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
[data-skin="whimsy"] .poster{clip-path:none;border-radius:22px;
  background-image:radial-gradient(rgba(176,42,110,.09) 1.1px,transparent 1.6px),radial-gradient(70% 50% at 100% 0%,rgba(201,167,255,.35),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(255,158,207,.3),transparent 70%);
  background-size:14px 14px,100% 100%,100% 100%;box-shadow:inset 0 0 0 6px var(--bone),inset 0 0 0 7.5px rgba(42,24,48,.2)}
[data-skin="whimsy"] .poster::after{content:"";position:absolute;right:16px;bottom:12px;width:46px;height:20px;opacity:.12;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-15 -7 30 13'><path fill='%232a1830' d='M0 0 C-2-3-5-4-7-2-8-5-11-6-14-5-11-4-11-1-12 1-9 0-7 1-5 3-3 2-1 2 0 4 1 2 3 2 5 3 7 1 9 0 12 1 11-1 11-4 14-5 11-6 8-5 7-2 5-4 2-3 0 0Z'/></svg>") no-repeat center/contain}
[data-skin="whimsy"] .tape{border-radius:3px;background:repeating-linear-gradient(90deg,rgba(201,167,255,.8) 0 7px,rgba(230,214,255,.8) 7px 14px)}
[data-skin="whimsy"] .poster h2{border-bottom:2px dotted rgba(42,24,48,.45)}
[data-skin="whimsy"] .poster h2 .big,[data-skin="whimsy"] .cd-top .big,[data-skin="whimsy"] .looks-top h2{text-transform:none;font-weight:700;letter-spacing:0}
[data-skin="whimsy"] .poster h2 .scr{color:var(--p-personal)}
[data-skin="whimsy"] .trk li{border-top:1px dotted rgba(42,24,48,.25)}
[data-skin="whimsy"] .check{border-radius:50%}
[data-skin="whimsy"] .t{font-weight:700}
[data-skin="whimsy"] .detail input,[data-skin="whimsy"] .detail textarea,[data-skin="whimsy"] .auth input{border-radius:12px;border-color:rgba(42,24,48,.25)}
[data-skin="whimsy"] .ghost{border-radius:999px}
[data-skin="whimsy"] .detail .btn,[data-skin="whimsy"] .auth .btn{background:var(--ink);color:var(--bone);box-shadow:none}
[data-skin="whimsy"] .void .scr{filter:none;color:var(--cyan);text-shadow:0 0 18px rgba(255,158,207,.6)}
[data-skin="whimsy"] .toast{clip-path:none;border-radius:999px;transform:translateX(-50%);box-shadow:0 0 30px -6px rgba(255,158,207,.8)}
[data-skin="whimsy"] .toast button{border-radius:999px}
/* countdown */
[data-skin="whimsy"] .cd-num{font-weight:700;text-shadow:4px 3px 0 rgba(255,158,207,.8),-3px -2px 0 rgba(201,167,255,.75)}
[data-skin="whimsy"] .cell{border-radius:8px;border-width:1px}
[data-skin="whimsy"] .cell.zero::after{content:"";position:absolute;inset:0}
[data-skin="whimsy"] .cd-new{border-radius:20px;background:rgba(42,24,48,.72);border-color:rgba(201,167,255,.35)}
[data-skin="whimsy"] .cd-new .lbl{color:var(--cyan)}
/* notes + picker */
[data-skin="whimsy"] .pad .ink{border-radius:999px}
[data-skin="whimsy"] .looks{background:rgba(22,14,28,.6)}
[data-skin="whimsy"] .looks-box{border-radius:26px;box-shadow:0 0 60px -10px rgba(255,158,207,.5)}
[data-skin="whimsy"] .look-card{border-radius:20px}
[data-skin="whimsy"] .dur.late{border-radius:999px;transform:none}
[data-skin="whimsy"] .ev{border-top-style:dotted}
[data-skin="whimsy"] .ev .bar{border-radius:99px}
[data-skin="whimsy"] .ev.now{background:linear-gradient(90deg,rgba(255,158,207,.3),transparent 70%);border-radius:12px}
[data-skin="whimsy"] .ev.now .tm::after,[data-skin="whimsy"] .nowline span{border-radius:999px}
[data-skin="whimsy"] .nowline{border-top-style:dashed}
[data-skin="whimsy"] .allday span{border-radius:999px;border-left-width:1.5px;background:color-mix(in srgb,var(--fc) 14%,transparent)}
[data-skin="whimsy"] .alsodue{border-top:2px dotted rgba(42,24,48,.45)}
[data-skin="whimsy"] .calset input{border-radius:12px}
[data-skin="whimsy"] .calmanage{border-radius:20px;background:rgba(42,24,48,.72);border-color:rgba(201,167,255,.35)}
[data-skin="whimsy"] .calmanage summary{color:var(--cyan)}

@media (max-width:520px){[data-skin="whimsy"] .mast{min-height:255px}[data-skin="whimsy"] .stamp{width:74px;height:74px;right:6px;bottom:52px}[data-skin="whimsy"] .stamp b{font-size:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.sweep{display:none}}
</style>

<script>
const AREAS=[
  {id:"studies",name:"Studies",c:"var(--studies)",pc:"var(--p-studies)"},
  {id:"projects",name:"Projects",c:"var(--projects)",pc:"var(--p-projects)"},
  {id:"travel",name:"Travel",c:"var(--travel)",pc:"var(--p-travel)"},
  {id:"personal",name:"Personal",c:"var(--personal)",pc:"var(--p-personal)"},
];
const AREA=Object.fromEntries(AREAS.map(a=>[a.id,a]));
const TABS=[["today","Today","today"],["upcoming","Next","upcoming"],["cal","Schedule","cal"],["count","Countdown","count"],["all","All","all"],["notes","Notes","notes"],["done","Done","done"]];
const ECHO={today:"Today",upcoming:"Next up",cal:"Schedule",count:"T-minus",all:"Everything",notes:"Notes",done:"Done"};
let cds=load("db.cds",[]);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE=matchMedia("(pointer: fine)").matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const dayOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?0:ms));
function durLabel(s){
  if(!s)return"––";
  if(s===dayOffset(0))return"today";if(s===dayOffset(1))return"tmrw";if(s===dayOffset(-1))return"yday";
  const d=new Date(s+"T00:00");return `${pad2(d.getDate())} ${d.toLocaleDateString("en-IN",{month:"short"})}`;
}
function lateTxt(due){const n=-daysUntil(due);return n===1?"deadline passed yesterday":`deadline passed ${n} days ago`}
function longDate(s){
  if(s===dayOffset(1))return["Tomorrow",""];
  const d=new Date(s+"T00:00");
  return[d.toLocaleDateString("en-IN",{weekday:"long"}),`${pad2(d.getDate())}.${pad2(d.getMonth()+1)}`];
}
function load(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

let state={tab:load("db.tab","today"),filter:load("db.filter","all"),addArea:load("db.addArea","studies"),open:null,confirmDel:null};
let items=[];let pads={};let db=null;let ready=false;
const known=new Set();let fresh=new Set();let firstPaint=true;

{const d=new Date();$("#today").textContent=`${d.toLocaleDateString("en-IN",{weekday:"short"})} ${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`;}

/* ---------- distressed edges ---------- */
const jagCache={};
function jag(seed){
  if(jagCache[seed])return jagCache[seed];
  let s=seed*9301+49297;const r=()=>(s=(s*9301+49297)%233280)/233280;
  const p=[],n=16;
  for(let i=0;i<=n;i++)p.push(`${(i/n*100).toFixed(1)}% ${(r()*1.6).toFixed(2)}%`);
  for(let i=1;i<=n;i++)p.push(`${(100-r()*1.4).toFixed(2)}% ${(i/n*100).toFixed(1)}%`);
  for(let i=n-1;i>=0;i--)p.push(`${(i/n*100).toFixed(1)}% ${(100-r()*1.8).toFixed(2)}%`);
  for(let i=n-1;i>0;i--)p.push(`${(r()*1.3).toFixed(2)}% ${(i/n*100).toFixed(1)}%`);
  return jagCache[seed]=`polygon(${p.join(",")})`;
}
const ROT=[-1.4,1.1,-.6,1.6,-1];

/* ---------- masthead echo ---------- */
function setEcho(animate){
  const w=ECHO[state.tab]||"Today";
  $("#echo").innerHTML=[0,1,2,3].map(i=>`<span style="--i:${i}">${esc(w)}</span>`).join("");
  if(animate&&!REDUCED){const e=$("#echo");e.classList.remove("swap");void e.offsetWidth;e.classList.add("swap");glitch()}
}
function glitch(){if(REDUCED)return;const t=$("#title");t.classList.remove("glitch");void t.offsetWidth;t.classList.add("glitch")}
$("#title").addEventListener("pointerenter",glitch);
setInterval(()=>{if(!document.hidden&&Math.random()<.5)glitch()},7000);

/* ---------- quick add ---------- */
function renderAddAreas(){
  $("#addAreas").innerHTML=AREAS.map(a=>`<button type="button" class="chip" style="--c:${a.c}" data-addarea="${a.id}" aria-pressed="${state.addArea===a.id}"><span class="dot"></span>${a.name}</button>`).join("");
}
$("#addAreas").addEventListener("click",e=>{const b=e.target.closest("[data-addarea]");if(!b)return;state.addArea=b.dataset.addarea;save("db.addArea",state.addArea);renderAddAreas()});
document.querySelectorAll("[data-quick]").forEach(b=>b.addEventListener("click",()=>{$("#newDue").value=b.dataset.quick===""?"":dayOffset(+b.dataset.quick)}));
$("#newTitle").addEventListener("input",()=>{$("#addBtn").disabled=!$("#newTitle").value.trim()||!db});
$("#addForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!db)return;
  let title=$("#newTitle").value.trim();if(!title)return;
  let area=state.addArea,due=$("#newDue").value;
  title=title.replace(/#(\w+)/g,(m,w)=>{w=w.toLowerCase();const a=AREAS.find(x=>x.id===w||x.id.startsWith(w));if(a){area=a.id;return""}return m});
  title=title.replace(/\b(today|tomorrow|tmrw)\b/i,m=>{due=dayOffset(/today/i.test(m)?0:1);return""});
  title=title.replace(/\s{2,}/g," ").trim();if(!title)return;
  $("#newTitle").value="";$("#newDue").value="";$("#addBtn").disabled=true;
  const r=$("#addBtn").getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,AREA[area].c,22);pulse(.6);
  try{await api.add({title,area,due})}
  catch(err){toast("Couldn't save. Check your connection.")}
});

/* ---------- tabs ---------- */
const passFilter=i=>state.filter==="all"||i.area===state.filter;
function counts(){
  const t=dayOffset(0),open=items.filter(i=>!i.done&&passFilter(i));
  const next=cds.filter(c=>c.at>=t).sort((a,b)=>a.at.localeCompare(b.at))[0];
  const now=Date.now(),left=cal?.events?cal.events.filter(e=>!e.a&&ymd(new Date(e.s))===t&&Date.parse(e.e)>now).length:0;
  return{today:open.filter(i=>!i.due||i.due<=t).length,upcoming:open.filter(i=>i.due>t).length,cal:left||"",count:next?daysUntil(next.at)+"d":"",all:open.length,done:items.filter(i=>i.done&&passFilter(i)).length,notes:""};
}
const TROT=[-2.5,1.8,-1.2,2.4,-1.8,1.4,-2];
function renderTabs(){
  const c=counts();
  $("#leftCount").textContent=ready&&db?pad2(items.filter(i=>!i.done&&i.due&&i.due<=dayOffset(0)).length):"––";
  $("#tabs").innerHTML=TABS.map(([id,n],k)=>`<button class="tab" role="tab" style="--r:${TROT[k]}deg" data-tab="${id}" aria-selected="${state.tab===id}">${n}${c[id]!==""&&ready?`<span class="n">${c[id]}</span>`:""}</button>`).join("");
  $("#filters").hidden=state.tab==="notes"||state.tab==="count"||state.tab==="cal";
  $("#filters").innerHTML=[{id:"all",name:"Everything"},...AREAS].map(a=>`<button class="chip" style="${a.c?`--c:${a.c}`:""}" data-filter="${a.id}" aria-pressed="${state.filter===a.id}">${a.c?'<span class="dot"></span>':""}${a.name}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b||b.dataset.tab===state.tab)return;
  state.tab=b.dataset.tab;state.open=null;save("db.tab",state.tab);sweep();setEcho(true);render(true);
  if(state.tab==="cal"&&(!cal||Date.now()-(cal.at||0)>3e5||cal.fromDay!==dayOffset(0)))loadCal()});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=b.dataset.filter;save("db.filter",state.filter);render(true)});
function sweep(){if(REDUCED)return;const s=$("#sweep");s.classList.remove("go");void s.offsetWidth;s.classList.add("go");pulse(.8)}

/* ---------- posters ---------- */
const CHECK=`<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>`;
const SCRIB=`<svg class="scrib" viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M1 7 C12 2,20 10,32 6 S52 2,62 7 S82 11,99 4"/></svg>`;
function rowHTML(i,n){
  const a=AREA[i.area]||AREAS[0],t=dayOffset(0),late=!i.done&&i.due&&i.due<t,open=state.open===i.id;
  let h=`<li class="${i.done?"done":""}${fresh.has(i.id)?" fresh":""}" style="--c:${a.c};--pc:${a.pc}" data-id="${i.id}">
    <div class="row">
      <span class="no" aria-hidden="true">${pad2(n+1)}</span>
      <button class="check" data-act="toggle" aria-label="${i.done?"Mark not done":"Mark done"}: ${esc(i.title)}">${CHECK}</button>
      <button class="main" data-act="open" aria-expanded="${open}"><span class="t">${esc(i.title)}${SCRIB}</span>
        <span class="sub"><span class="ar">${a.name}</span>${late?`<span class="carry">↻ carried over · ${lateTxt(i.due)}</span>`:""}${i.notes?'<span class="nt">notes</span>':""}</span></button>
      <span class="dur${late?" late":""}"${late?` title="Was due ${durLabel(i.due)}"`:""}>${late?`−${-daysUntil(i.due)}d`:durLabel(i.due)}</span>
    </div>`;
  if(open){
    h+=`<div class="detail">
      <input id="ed-title-${i.id}" value="${esc(i.title)}" aria-label="Task name">
      <textarea id="ed-notes-${i.id}" placeholder="notes, links, sub-steps…" aria-label="Notes">${esc(i.notes)}</textarea>
      <div class="opts">${AREAS.map(x=>`<button class="chip" style="--c:${x.c};--pc:${x.pc}" data-act="area" data-area="${x.id}" aria-pressed="${i.area===x.id}"><span class="dot"></span>${x.name}</button>`).join("")}</div>
      <div class="opts">
        <input type="date" id="ed-due-${i.id}" value="${esc(i.due)}" aria-label="Due date">
        <button class="ghost" data-act="due-clear">No date</button>
        <span class="sp"></span>
        ${state.confirmDel===i.id?`<button class="ghost" data-act="del-cancel">Keep</button><button class="ghost del" data-act="del-yes">Tear it up</button>`:`<button class="ghost del" data-act="del">Delete</button>`}
        <button class="btn" data-act="close">Done</button>
      </div></div>`;
  }
  return h+"</li>";
}
let pIdx=0;
function poster(big,scr,list,{cls="",note=""}={}){
  if(!list.length)return"";const k=pIdx++;
  return `<div class="pw${firstPaint||animIn?" in":""}" style="--rot:${ROT[k%ROT.length]}deg;--d:${k*90}ms">
    <span class="tape" style="transform:rotate(${k%2?5:-4}deg)"></span>
    <div class="poster ${cls}" style="--jag:${jag(k+3)}">
      <h2><span><span class="big">${esc(big)}</span>${scr?` <span class="scr">${esc(scr)}</span>`:""}</span><small>${note||`${list.length} ${list.length===1?"track":"tracks"}`}</small></h2>
      <ol class="trk">${list.map(rowHTML).join("")}</ol>
    </div></div>`;
}
const voidHTML=(scr,p)=>`<div class="void"><span class="scr">${scr}</span><p>${p}</p></div>`;
const byDue=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||a.created-b.created;
let animIn=false;

function renderView(){
  const v=$("#view");pIdx=0;
  if(!ready){v.innerHTML=voidHTML("tuning in…","pulling your tasks from the cloud");return}
  if(!db){v.innerHTML=voidHTML("no signal","open this page signed in to claude so tasks can save and sync");return}
  const t=dayOffset(0),open=items.filter(i=>!i.done&&passFilter(i)).sort(byDue);let html="";
  if(state.tab==="today"){
    const late=open.filter(i=>i.due&&i.due<t),now=open.filter(i=>i.due===t),any=open.filter(i=>!i.due);
    const doneToday=items.filter(i=>i.done&&passFilter(i)&&i.doneAt&&ymd(new Date(i.doneAt))===t);
    const day=[...late,...now],nt=`${day.length} ${day.length===1?"track":"tracks"}${late.length?` · ${late.length} carried over`:""}`;
    html=poster("Today","side a",day,{cls:late.length?"has-late":"",note:nt})+poster("Anytime","b-sides",any)+poster("Played","today",doneToday);
    if(!late.length&&!now.length&&!any.length)html=voidHTML("silence","nothing due today · add something above")+html;
  }else if(state.tab==="upcoming"){
    const fut=open.filter(i=>i.due>t),days={};fut.forEach(i=>(days[i.due]??=[]).push(i));
    html=fut.length?Object.keys(days).sort().map(d=>{const[w,dd]=longDate(d);return poster(w,"",days[d],{note:dd?`${dd} · ${days[d].length}`:""})}).join(""):voidHTML("empty road","give a task a date and it shows up here");
  }else if(state.tab==="all"){
    html=open.length?AREAS.filter(a=>state.filter==="all"||a.id===state.filter).map(a=>poster(a.name,"",open.filter(i=>i.area===a.id))).join(""):voidHTML("all clear","no open tasks");
  }else if(state.tab==="cal"){
    html=calHTML();
  }else if(state.tab==="count"){
    const list=[...cds].sort((a,b)=>a.at.localeCompare(b.at));
    html=(list.length?list.map(cdPoster).join(""):voidHTML("no countdowns","add an exam, deadline or trip below"))+cdFormHTML();
  }else if(state.tab==="done"){
    const d=items.filter(i=>i.done&&passFilter(i)).sort((a,b)=>b.doneAt-a.doneAt).slice(0,200);
    html=d.length?poster("Played","the archive",d):voidHTML("nothing yet","tick a task and it lands here");
  }else{
    const ph={travel:"trip plans, bookings, packing list…",studies:"syllabus, exam dates, formulas…",projects:"ideas, links, next steps…",personal:"anything else…"};
    html=`<div class="pads">${AREAS.map((a,k)=>`<div class="pw${firstPaint||animIn?" in":""}" style="--rot:${ROT[k]}deg;--d:${k*90}ms"><span class="tape" style="transform:rotate(${k%2?5:-4}deg)"></span>
      <div class="poster pad" style="--jag:${jag(k+11)};--pc:${a.pc}"><h2><span class="big">${a.name}</span><small id="padstat-${a.id}">notes</small></h2><span class="ink"></span>
      <textarea id="pad-${a.id}" data-pad="${a.id}" placeholder="${ph[a.id]}">${esc(pads[a.id]||"")}</textarea></div></div>`).join("")}</div>`;
  }
  v.innerHTML=`<div class="board">${html}</div>`;
  fresh=new Set();
  if(state.tab==="count"){tick();if(animIn||firstPaint)rollNumbers()}
}

/* ---------- schedule (calendar feeds) ---------- */
let cal=load("db.cal",null),calDays=14,calLoading=false,calAgain=false,calErr="",calMsg="";
const FEEDC=["var(--p-studies)","var(--p-personal)","var(--p-projects)","var(--p-travel)"];
const fmtT=iso=>new Date(iso).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
const typingCal=()=>{const a=document.activeElement;return a&&a.closest&&a.closest("#calForm,#calForm2")};
async function loadCal(){
  if(!db)return;if(calLoading){calAgain=true;return}calLoading=true;
  const st=$("#calStatus");if(st)st.textContent="syncing…";
  try{
    const{data,error}=await sb.functions.invoke("calendar",{body:{fromDay:dayOffset(0),days:calDays,tz:Intl.DateTimeFormat().resolvedOptions().timeZone}});
    if(error)throw error;cal={...data,at:Date.now()};save("db.cal",cal);calErr="";
  }catch{calErr=navigator.onLine?"Couldn't reach your calendar right now. Showing the last copy.":"You're offline. Showing the last copy."}
  calLoading=false;renderTabs();
  if(state.tab==="cal"&&!typingCal()){renderView();bindTilt()}
  if(calAgain){calAgain=false;loadCal()}
}
function calSetupHTML(){
  const k=pIdx++;
  return `<div class="pw${firstPaint||animIn?" in":""}" style="--rot:${ROT[k%ROT.length]}deg;--d:${k*90}ms"><span class="tape"></span>
  <div class="poster calset" style="--jag:${jag(k+31)}">
    <h2><span><span class="big">Hook up</span> <span class="scr">your calendar</span></span><small>one time</small></h2>
    <ol>
      <li>On a <b>laptop</b>, open <b>calendar.google.com</b>. The phone app doesn't have this option.</li>
      <li>On the left under <b>My calendars</b>, hover your calendar, click the <b>⋮</b> next to it, then <b>Settings and sharing</b>.</li>
      <li>Scroll down to <b>Integrate calendar</b> and copy the <b>Secret address in iCal format</b> (it ends in <b>.ics</b>).</li>
      <li>Paste it below and press <b>Connect</b>.</li>
    </ol>
    <p class="warn">Keep that link private: anyone who has it can see your calendar. Daybook only reads it. College accounts sometimes hide this option; a personal Gmail calendar always has it.</p>
    ${calFormHTML("calForm")}
  </div></div>`;
}
function calFormHTML(id){
  return `<form id="${id}" autocomplete="off">
    <label for="${id}-url">Secret iCal address</label>
    <input id="${id}-url" type="url" inputmode="url" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" required>
    <label for="${id}-name">Name it (optional)</label>
    <input id="${id}-name" type="text" maxlength="60" placeholder="Classes, Personal…">
    <button class="btn" type="submit">Connect</button>
    <p class="msg" role="status">${esc(calMsg)}</p>
  </form>`;
}
function calManageHTML(){
  const fi=cal.feeds.map((f,k)=>`<li style="--fc:${FEEDC[k%FEEDC.length]}"><i></i><span>${esc(f.name)}</span><span class="sp"></span>
    ${state.confirmDel==="feed:"+f.id?`<button class="ghost" data-calact="keep">Keep</button><button class="ghost del" data-calact="del-yes" data-id="${f.id}">Disconnect</button>`:`<button class="ghost del" data-calact="del" data-id="${f.id}">Remove</button>`}</li>`).join("");
  return `<details class="calmanage"${state.confirmDel?.startsWith?.("feed:")||calMsg?" open":""}><summary>Calendars (${cal.feeds.length}) · add another</summary><ul>${fi}</ul>${calFormHTML("calForm2")}</details>`;
}
function calHTML(){
  if(!cal)return voidHTML("tuning in…","fetching your schedule");
  if(!cal.feeds?.length)return calSetupHTML();
  const t=dayOffset(0),t0=new Date(t+"T00:00").getTime(),now=Date.now(),byDay={},all={};
  const fi=Object.fromEntries(cal.feeds.map((f,k)=>[f.id,k]));
  for(const e of cal.events||[]){
    const fc=FEEDC[(fi[e.f]??0)%FEEDC.length];
    if(e.a){if(e.e<=t)continue;for(let d=e.s<t?t:e.s,g=0;d<e.e&&g<70;g++){(all[d]??=[]).push({...e,fc});const x=new Date(d+"T00:00");x.setDate(x.getDate()+1);d=ymd(x)}}
    else{if(Date.parse(e.e)<=t0&&Date.parse(e.s)<t0)continue;let k=ymd(new Date(e.s));if(k<t)k=t;(byDay[k]??=[]).push({...e,fc})}
  }
  const due={};items.filter(i=>!i.done&&i.due).forEach(i=>(due[i.due<t?t:i.due]??=[]).push(i));
  let h="";
  for(let n=0;n<calDays;n++){
    const d=dayOffset(n),ev=(byDay[d]||[]).sort((a,b)=>a.s.localeCompare(b.s)),ad=all[d]||[],du=due[d]||[];
    if(n>0&&!ev.length&&!ad.length&&!du.length)continue;

/* ---------- halftone ink field ---------- */
const cv=$("#field"),cx=cv.getContext("2d"),fx=$("#fx"),fc=fx.getContext("2d");
let W=0,H=0,cell=10,ptr={x:-9999,y:-9999,s:0},boost=0,parts=[];
const SKINS={
  wall:{name:"The Wall",desc:"grunge · xerox · halftone ink",theme:"#06080b",dot1:"#8fe6ff",dot2:"#c8e86b",a1:.42,a2:.22,cell:[8,10],echo:"Today"},
  whimsy:{name:"Dark Whimsy",desc:"pastel goth · bats · moonlit haze",theme:"#160e1c",dot1:"#ff9ecf",dot2:"#c9a7ff",a1:.55,a2:.45,cell:[14,18]},
};
const skin=()=>SKINS[document.documentElement.dataset.skin]?document.documentElement.dataset.skin:"wall";
function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;fx.width=W;fx.height=H;const c=SKINS[skin()].cell;cell=W<600?c[0]:c[1]}
addEventListener("resize",()=>{resize();if(REDUCED)drawField(0)});resize();
addEventListener("pointermove",e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.s=Math.min(1,ptr.s+.08)},{passive:true});
addEventListener("pointerdown",e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.s=1;boost=Math.min(1,boost+.35)},{passive:true});
function pulse(v){boost=Math.min(1.2,boost+v)}
const BLOBS=[[.31,.23,0,1.3,.22],[.21,.37,2,.4,.18],[.43,.17,4,2.1,.16],[.17,.29,1,3.3,.2],[.27,.41,5,.9,.14]];
function drawField(t){
  cx.clearRect(0,0,W,H);
  const asp=W/H,cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1,bl=BLOBS.map(([a,b,p,q,r])=>[.5+.36*Math.sin(t*a*.6+p),.5+.34*Math.cos(t*b*.6+q),r*r*(1+boost*.6)]);

  const path=new Path2D();
  for(let j=0;j<rows;j++){const y=j*cell,v=y/H;
    for(let i=0;i<cols;i++){const x=i*cell+(j%2?cell/2:0),u=x/W;
      let val=0;
      for(const[bx,by,r2]of bl){const dx=(u-bx)*asp,dy=v-by;val+=Math.exp(-(dx*dx+dy*dy)/r2)}
      const dx=(u-px)*asp,dy=v-py;val+=ps*Math.exp(-(dx*dx+dy*dy)/pr);

const BAT=new Path2D("M0 0 C-2-3-5-4-7-2-8-5-11-6-14-5-11-4-11-1-12 1-9 0-7 1-5 3-3 2-1 2 0 4 1 2 3 2 5 3 7 1 9 0 12 1 11-1 11-4 14-5 11-6 8-5 7-2 5-4 2-3 0 0Z");
const SPARK=new Path2D("M0-5 L1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2Z");
function burst(x,y,col,n){
  if(REDUCED)return;
  if(col.startsWith("var("))col=getComputedStyle(document.documentElement).getPropertyValue(col.slice(4,-1)).trim()||"#8fe6ff";
  if(skin()==="whimsy"){
    const cols=["#2a1830","#ff9ecf","#c9a7ff","#ffe7b3"];
    for(let k=0;k<Math.ceil(n*.7);k++){const bat=k%3===0,a=-Math.PI/2+(Math.random()-.5)*2.4,s=1+Math.random()*3.2;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:bat?.7+Math.random()*.7:.5+Math.random()*.8,life:1,col:bat?"#2a1830":cols[1+k%3],kind:bat?"bat":"spark",ph:Math.random()*6.28,spin:(Math.random()-.5)*.2})}
    return;
  }
  for(let k=0;k<n;k++){const a=Math.random()*6.283,s=1.5+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,r:1+Math.random()*3.5,life:1,col})}

function drawFx(){
  fc.clearRect(0,0,W,H);
  parts=parts.filter(p=>(p.life-=p.kind?.014:.028)>0);
  for(const p of parts){
    fc.globalAlpha=Math.min(1,p.life*1.4);fc.fillStyle=p.col;
    if(p.kind){
      p.ph+=.35;p.x+=p.vx+Math.sin(p.ph*.4)*.6;p.y+=p.vy;p.vy-=.02;p.vx*=.99;
      fc.save();fc.translate(p.x,p.y);
      if(p.kind==="bat"){fc.scale(p.r*1.6,p.r*1.6*(.55+.45*Math.abs(Math.sin(p.ph))));fc.fill(BAT)}
      else{fc.rotate(p.ph*p.spin*10);fc.scale(p.r,p.r);fc.shadowColor=p.col;fc.shadowBlur=8;fc.fill(SPARK)}

    }else{p.vy+=.18;p.vx*=.97;p.x+=p.vx;p.y+=p.vy;fc.beginPath();fc.arc(p.x,p.y,p.r*(.6+p.life*.4),0,6.283);fc.fill()}
  }

{const n=$("#stars");let h="";for(let i=0;i<46;i++)h+=`<i style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*70).toFixed(1)}%;--s:${(1+Math.random()*2.2).toFixed(1)}px;--d:${(Math.random()*4).toFixed(2)}s;--t:${(2.5+Math.random()*3).toFixed(2)}s"></i>`;n.innerHTML=h}
const warpMap=document.getElementById("warpMap");
let last=0;const t0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  if(parts.length)drawFx();else if(fx._dirty){fc.clearRect(0,0,W,H)}
  fx._dirty=parts.length>0;
  if(now-last<41)return;last=now;
  const t=(now-t0)/1000;
  boost*=.94;ptr.s*=.985;
  drawField(t);

}
if(REDUCED)drawField(2);else requestAnimationFrame(frame);

/* ---------- sync layer (Supabase) ---------- */
const SB_URL="https://ebbxcgvcagjoolrzgslu.supabase.co";
const SB_KEY="sb_publishable_9lVUdlHCa1R5zoQd29EjKg_0UVWyOsV";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const fromRow=r=>({id:r.id,title:r.title,area:r.area,due:r.due||"",done:r.done,notes:r.notes||"",created:Date.parse(r.created_at)||0,doneAt:r.done_at?Date.parse(r.done_at):0});
function toRow(p){const o={};
  if("title"in p)o.title=p.title;if("area"in p)o.area=p.area;if("notes"in p)o.notes=p.notes;if("done"in p)o.done=p.done;
  if("due"in p)o.due=p.due||null;if("doneAt"in p)o.done_at=p.doneAt?new Date(p.doneAt).toISOString():null;return o}
const api={
  async add({title,area,due}){const{error}=await sb.from("items").insert({title,area,due:due||null});if(error)throw error;refresh()},
  async update(id,p){const{error}=await sb.from("items").update(toRow(p)).eq("id",id);if(error)throw error;refresh()},
  async del(id){const{error}=await sb.from("items").delete().eq("id",id);if(error)throw error;refresh()},
  async pad(area,body){const{error}=await sb.from("pads").upsert({area,body,updated_at:new Date().toISOString()},{onConflict:"user_id,area"});if(error)throw error},
};
let refreshing=null,again=false,channel=null;
async function refresh(){
  if(refreshing){again=true;return refreshing}
  refreshing=(async()=>{
    const{data,error}=await sb.from("items").select("*").order("created_at");
    if(error){$("#status").textContent=navigator.onLine?"sync error":"offline";return}
    const next=data.map(fromRow);const wasReady=ready;
    if(wasReady)next.forEach(i=>{if(!known.has(i.id))fresh.add(i.id)});
    next.forEach(i=>known.add(i.id));items=next;save("db.cache",items);
    ready=true;$("#status").textContent="live";$("#addBtn").disabled=!$("#newTitle").value.trim();
    const ae=document.activeElement;
    if(state.tab==="notes"||(ae&&/^ed-/.test(ae.id))||(ae&&ae.closest&&ae.closest("#cdForm")))renderTabs();else{render(!wasReady);firstPaint=false}
  })();
  try{await refreshing}finally{refreshing=null;if(again){again=false;refresh()}}
}
async function loadPads(){
  const{data}=await sb.from("pads").select("area,body");
  (data||[]).forEach(r=>{pads[r.area]=r.body;const ta=document.getElementById("pad-"+r.area);if(ta&&document.activeElement!==ta&&ta.value!==r.body)ta.value=r.body});
}
let rt;const soon=()=>{clearTimeout(rt);rt=setTimeout(()=>{refresh();loadPads();loadCds(false)},250)};
function startSync(){
  db=sb;$("#authBox").hidden=true;$("#app").hidden=false;$("#signOut").hidden=false;
  const cached=load("db.cache",null);if(cached&&!ready){items=cached;cached.forEach(i=>known.add(i.id));ready=true;render(true)}
  refresh();loadPads();loadCds(true);loadCal();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("daybook").on("postgres_changes",{event:"*",schema:"public",table:"items"},soon).on("postgres_changes",{event:"*",schema:"public",table:"pads"},soon).on("postgres_changes",{event:"*",schema:"public",table:"countdowns"},soon).subscribe();
}
function showAuth(){
  db=null;ready=false;items=[];known.clear();
  $("#app").hidden=true;$("#signOut").hidden=true;$("#authBox").hidden=false;$("#status").textContent="signed out";
}
addEventListener("focus",()=>db&&soon());
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db){soon();if(state.tab==="cal"&&Date.now()-(cal?.at||0)>3e5)loadCal()}});
addEventListener("online",()=>db&&soon());
addEventListener("offline",()=>{$("#status").textContent="offline"});

/* auth form */
let signingUp=false;
$("#authSwap").addEventListener("click",()=>{signingUp=!signingUp;
  $("#authHead").textContent=signingUp?"Join":"Sign in";$("#authBtn").textContent=signingUp?"Create account":"Enter";
  $("#authSwap").textContent=signingUp?"Already have an account? Sign in":"First time? Create your account";
  $("#authPass").autocomplete=signingUp?"new-password":"current-password";$("#authMsg").textContent="";});
$("#authForm").addEventListener("submit",async e=>{
  e.preventDefault();const msg=$("#authMsg");msg.className="msg";msg.textContent=signingUp?"creating…":"signing in…";
  const email=$("#authEmail").value.trim(),password=$("#authPass").value;
  if(signingUp){
    const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){msg.className="msg err";msg.textContent=error.message;return}
    if(!data.session){msg.textContent="Check your email and tap the confirm link, then come back and sign in.";signingUp=true;$("#authSwap").click()}
  }else{
    const{error}=await sb.auth.signInWithPassword({email,password});
    if(error){msg.className="msg err";msg.textContent=/confirm/i.test(error.message)?"Confirm your email first (check your inbox), then sign in.":"Wrong email or password.";}
  }
});
$("#signOut").addEventListener("click",()=>{try{["db.cache","db.cds","db.cal"].forEach(k=>localStorage.removeItem(k))}catch{}cal=null;cds=[];sb.auth.signOut()});

/* ---------- boot ---------- */
applySkin(load("db.skin","wall"));
const syncSkin=s=>{const k=s?.user?.user_metadata?.skin;if(k&&k!==skin())applySkin(k,{animate:true})};
setEcho(false);renderAddAreas();
if(!sb){$("#status").textContent="no signal";$("#authBox").hidden=false;$("#authMsg").textContent="Couldn't load the sync library. Check your connection and reload.";}
else{
  sb.auth.onAuthStateChange((ev,session)=>{if(session){syncSkin(session);if(!db)startSync()}else showAuth()});
  sb.auth.getSession().then(({data})=>{if(data.session){syncSkin(data.session);if(!db)startSync()}else showAuth()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db)sb.auth.getUser().then(({data})=>syncSkin(data)).catch(()=>{})});
}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
